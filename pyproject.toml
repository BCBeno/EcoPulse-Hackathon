[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ecopulse-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "email-validator>=2.2,<3",
  "sqlalchemy>=2.0.36,<2.1", "geoalchemy2>=0.17,<1", "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2", "httpx>=0.28,<1", "PyJWT>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1", "apscheduler>=3.11,<4", "aiosqlite>=0.20,<1",
  "shapely>=2.0,<3", "defusedxml>=0.7,<1", "beautifulsoup4>=4.12,<5",
  "xlrd>=2.0.1,<3", "tzdata>=2024.1"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
