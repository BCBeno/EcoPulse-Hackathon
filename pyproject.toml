[project]
name = "ecopulse"
version = "1.0.0.dev0"
description = "EcoPulse backend: air quality map, clean routes and community reports for Iași"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.160",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "sqlalchemy[asyncio]>=2.1",
  "asyncpg>=0.30",
  "geoalchemy2>=0.17",
  "alembic>=1.16",
  "httpx>=0.28",
  "shapely>=2.1",
  "tzdata>=2026.6",
]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "ruff>=0.12",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]
