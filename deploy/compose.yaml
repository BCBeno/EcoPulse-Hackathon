# Production stack on the EcoPulse LXC (/opt/ecopulse). Only `web` is exposed (port 80);
# nginx-proxy-manager on the infra LXC forwards ecopulse.bcbeno.me here.
#   docker compose -f deploy/compose.yaml --env-file deploy/.env.production up -d --build
name: ecopulse

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-app: &app
  build: ..
  env_file: .env.production
  environment:
    DATABASE_URL: postgresql+asyncpg://ecopulse:${POSTGRES_PASSWORD}@db:5432/ecopulse
    GRAPHHOPPER_URL: http://graphhopper:8989
  depends_on:
    db: { condition: service_healthy }
  restart: unless-stopped
  logging: *logging

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: ecopulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ecopulse
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecopulse -d ecopulse"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging: *logging

  graphhopper:
    build: ./graphhopper
    environment:
      JAVA_OPTS: "-Xmx1g -Xms256m"
    volumes:
      - ./graphhopper/data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8989/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 60
    restart: unless-stopped
    logging: *logging

  api:
    <<: *app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 10s
      timeout: 3s
      retries: 30

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]

  web:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    logging: *logging

  backup:
    image: postgis/postgis:17-3.5
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    # Nightly dump, keeps the last 7 days.
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          pg_dump -h db -U ecopulse -Fc ecopulse > /backups/ecopulse-$$(date +%F).dump &&
          find /backups -name 'ecopulse-*.dump' -mtime +7 -delete
          sleep 86400
        done
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
    logging: *logging

volumes:
  dbdata:
